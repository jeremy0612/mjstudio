[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mjstudio"
version = "0.1.0"
description = "A reusable native MuJoCo paneled viewer: one GLFW window with the interactive 3D view, a camera-thumbnail strip, and an info/log panel."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mujoco>=3.2",
    "glfw>=2.6",
    "numpy>=1.23",
]

[project.urls]
Homepage = "https://github.com/jeremy0612/mjstudio"

[tool.setuptools.packages.find]
where = ["src"]
