[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mjstudio"
version = "0.2.0"
description = "Wrap MuJoCo's own viewer and add panels around it: the real interactive 3D view + a camera-thumbnail strip + an info/log panel, via the passive viewer's overlay hooks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mujoco>=3.2",
    "numpy>=1.23",
]

[project.urls]
Homepage = "https://github.com/jeremy0612/mjstudio"

[tool.setuptools.packages.find]
where = ["src"]
